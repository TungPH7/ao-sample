# Quality gates of a project (quality-gates spec sections 2.2–2.8). CI, merge-gate, audit, gh:protect and the hooks read
# the project's copy in .ai-orchestrator/quality/. That copy is a protected path, and a PR that lowers a threshold here
# turns the policy job red.

# The jobs of kit/.github/workflows/ci.yml; merge-gate, audit and the ruleset require every one of them.
checks: [policy, build-test, secrets, sast]

# Coverage of the lines a PR adds or changes, read from the lcov files the project's test:coverage script writes. The
# project's coverage must include every source file, even one no test imports yet. Config files and generated
# migrations are left out (Checkpoint 1, 2026-10-29), and so is the kit copy in .ai-orchestrator/ and .claude/, whose
# code is tested in the kit.
coverage:
  changed_lines_min: 80
  lcov: ["coverage/lcov.info", "apps/*/coverage/lcov.info"]
  source: ["**/*.{ts,tsx,js,jsx,mjs,cjs}"]
  exclude: ["**/*.{test,spec}.*", "**/*.e2e-spec.*", "**/*.d.ts", "**/*.config.*", "**/migrations/**", "e2e/**", ".ai-orchestrator/**", ".claude/**"]

# npm audit fails on this level and above. An exception names a GitHub advisory, why it is accepted, and when it ends.
dependencies:
  audit_level: high
  exceptions: []

# Lines that switch a check off. A line that also carries the reason marker passes, so the reviewer can read why;
# a `never` pattern fails even with a reason.
suppressions:
  reason_marker: "reason:"
  patterns:
    - "eslint-disable"
    - "oxlint-disable"   # oxlint, the linter of NestJS 12, honours both (Pilot 1 T1)
    - "@ts-ignore"
    - "@ts-nocheck"
    - ".skip("
    - "xit("
    - "xdescribe("
    - "istanbul ignore"
    - "c8 ignore"
    - "nosemgrep"
    - "gitleaks:allow"
    - "secretlint-disable"
  never: [".only("]

# Branches only a PR may change, and the merge method of each kind of work item branch.
protected_branches: [develop, main, "release/*"]
merge_method:
  feature: squash
  bugfix: squash
  hotfix: squash

# Files an agent may not edit, except the roles listed as editors. A PR of an agent that touches one is never merged by
# merge-gate: you read the diff and merge it yourself.
protected_paths:
  - { path: ".github/workflows/**", editors: [devops] }
  - { path: ".githooks/**" }
  - { path: ".claude/**" }
  - { path: ".ai-orchestrator/**" }
  - { path: ".mcp.json" }

# The effort of a full security review (Pilot 1, review cost): the roster's when the PR touches a protected path or one
# of these paths, or when its item or one of its Sub-tasks has an effort label; lower_effort otherwise. A review of only
# the changes since the last report stays at high (dev-workflow spec 2.6).
security_review:
  roster_effort_paths:
    # dependencies and how the app is built and run
    - "**/package.json"
    - "**/package-lock.json"
    - "**/Dockerfile*"
    - "**/docker-compose*.yml"
    - "**/.env*"
    - "**/next.config.*"
    - "**/main.ts"
    # where requests come in or are checked: NestJS and Next.js
    - "**/*.module.ts"
    - "**/*.controller.*"
    - "**/*.guard.*"
    - "**/*.pipe.*"
    - "**/*.filter.*"
    - "**/*.interceptor.*"
    - "**/*.middleware.*"
    - "**/*.strategy.*"
    - "**/*.dto.*"
    - "**/middleware.*"
    - "**/route.*"
    - "**/actions.*"
    # who the user is, and secrets
    - "**/auth/**"
    - "**/*auth*.*"
    - "**/*session*.*"
    - "**/*crypto*.*"
    # where data is read and written. Services are left out: most backend PRs change one, and would all be at max.
    - "**/*.repository.*"
    - "**/*.entity.*"
    - "**/prisma/**"
    - "**/migrations/**"
    - "**/*.sql"
  lower_effort: high

# The docs PR of an Epic (dev-workflow spec 2.4): every file it changes is under these paths, its head is this branch,
# ao-dev opened it, and <EPIC> is an Epic. merge-gate merges it without reviews or approval once the Epic is past this
# gate and the CI run of its head started before you approved; audit takes its merge commit on the same terms. Rule Q5
# keeps the paths in docs/, away from the protected paths, and the gate a gate of the contract.
docs_pull_requests:
  paths: ["docs/specs/<EPIC>/**", "docs/adr/**"]
  branch: "feature/<EPIC>-spec"
  gate: plan-approval

# The GitHub Apps of the agents: the variables that name each App, the roles that use it, and the ao-pr.mjs commands
# those roles may run with it.
github_apps:
  dev:
    env: AO_DEV_APP
    roles: [ba, sa, fe-dev, be-dev, devops]
    commands: [create, edit, comment]
  review:
    env: AO_REVIEW_APP
    roles: [reviewer, security]
    commands: [review]
