# audit (ai-orchestrator, quality-gates spec section 2.6): checks that the commit about to be deployed came through the
# gates. A deploy workflow calls it first, and its deploy job needs it:
#
#   permissions: { contents: read, pull-requests: read, checks: read, statuses: read, actions: read }
#   jobs:
#     audit:
#       uses: ./.github/workflows/audit.yml
#       secrets:
#         JIRA_CI_TOKEN: ${{ secrets.JIRA_CI_TOKEN }}
#     deploy:
#       needs: audit
#
# A called workflow cannot raise the permissions of the caller's token, so the caller grants the five above; actions:
# read dates the CI run of a docs PR (dev-workflow spec 2.4). When the audit fails, the deploy job does not run, the job
# summary says why, and the work item gets the Needs you flag.
name: audit

on:
  workflow_call:
    inputs:
      sha:
        description: The commit to deploy; the commit of the calling run when empty
        type: string
        default: ''
      branch:
        description: The branch it is deployed from; the branch of the calling run when empty
        type: string
        default: ''
    secrets:
      JIRA_CI_TOKEN:
        required: false

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      checks: read
      statuses: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci --prefix .ai-orchestrator
      # The commit and branch go through the environment, never into the shell line.
      - run: node .ai-orchestrator/scripts/audit.mjs --sha "$AUDIT_SHA" --branch "$AUDIT_BRANCH"
        env:
          AUDIT_SHA: ${{ inputs.sha || github.sha }}
          AUDIT_BRANCH: ${{ inputs.branch || github.ref_name }}
          JIRA_CI_TOKEN: ${{ secrets.JIRA_CI_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
